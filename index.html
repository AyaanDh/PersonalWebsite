<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayaan Dhalait's homepage</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#2f2f2f;
    color:#ddd;
    font-family:Arial,Helvetica,sans-serif;
    line-height:1.6;
}

.container{
    max-width:700px;
    margin:70px auto;
    padding:0 20px;
}

h1{
    font-size:2.2rem;
    margin-bottom:12px;
    font-weight:700;
}

hr{
    border:none;
    border-top:1px solid #444;
    margin:18px 0 30px;
}

h2{
    margin-bottom:18px;
    font-size:1.8rem;
}

ul{
    margin-left:22px;
}

li{
    margin:8px 0;
    display:flex;
    align-items:flex-start;
    gap:6px;
}

li a{
    color:#ff9f43;
    text-decoration:none;
    flex-shrink:0;
}

li a:hover{
    text-decoration:underline;
}

.desc{
    color:#bcbcbc;
    flex:1;
    min-width:0;
    overflow-wrap:anywhere;
}

footer{
    margin-top:60px;
    padding-top:18px;
    border-top:1px solid #444;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>Ayaan Dhalait's homepage</h1>

<hr>

<h2>Projects</h2>

<ul id="projects">
<li>Loading...</li>
</ul>

<footer>
copyright © <span id="year"></span> Ayaan Dhalait. all rights reserved.
</footer>

</div>

<script>
document.getElementById("year").textContent=new Date().getFullYear();

fetch("https://api.github.com/users/ayaandh/repos?sort=updated&per_page=100")
.then(r=>r.json())
.then(repos=>{
    const list=document.getElementById("projects");
    list.innerHTML="";

    repos
    .filter(repo=>!repo.fork)
    .sort((a,b)=>b.stargazers_count-a.stargazers_count)
    .forEach(repo=>{
        const li=document.createElement("li");

        const link=document.createElement("a");
        link.href=repo.html_url;
        link.target="_blank";
        link.rel="noopener";
        link.textContent=repo.name;

        li.appendChild(link);

        if(repo.description){
            const desc=document.createElement("span");
            desc.className="desc";
            desc.textContent=" - "+repo.description;
            li.appendChild(desc);
        }

        list.appendChild(li);
    });

    if(!list.children.length){
        list.innerHTML="<li>No public repositories.</li>";
    }
})
.catch(()=>{
    document.getElementById("projects").innerHTML="<li>Unable to load projects.</li>";
});
</script>

</body>
</html>
