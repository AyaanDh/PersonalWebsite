<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 • Page Not Found</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <main class="hero">

        <div class="container">

            <div class="badge">
                ERROR 404
            </div>

            <h1>

                Page <span class="accent">Not Found</span>

            </h1>

            <p class="subtitle">

                Looks like the page you're looking for doesn't exist,
                has been moved, or was never here.

            </p>

            <p class="description">

                You can head back to the homepage or browse the projects
                section to continue exploring.

            </p>

            <div class="buttons">

                <a href="/" class="primary">
                    Go Home
                </a>

                <a href="index.html#projects" class="secondary">
                    View Projects
                </a>

            </div>

        </div>

    </main>

</body>

</html>
